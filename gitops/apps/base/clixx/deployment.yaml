apiVersion: apps/v1
kind: Deployment
metadata:
  name: clixx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clixx
  template:
    metadata:
      labels:
        app: clixx
    spec:
      containers:
        - name: clixx
          image: public.ecr.aws/nginx/nginx:latest
          ports:
            - containerPort: 80
